name: Flutter CI
on:
  # pull_request:
  #   branches:
  #     - main
  push:
    branches:
      - main

jobs:
  flutter_test:
    name: Run flutter test and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Create .env files
        run: |
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" > .env.dev
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" > .env
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  build_android:
    name: Build Flutter (Android)
    needs: [flutter_test]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Create .env files
        run: |
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" > .env.dev
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" > .env

      - name: Create Android signing files
        run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_DEV }}" | base64 --decode > android/app/upload-keystore.jks

          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD}}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS}}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD}}
          EOF

      - name: Create google-services.json
        run: |
          mkdir -p android/app/src/dev
          printf '%s' "${{ secrets.GOOGLE_SERVICES_JSON_DEV }}" | base64 --decode > android/app/src/dev/google-services.json
      - run: flutter clean
      - run: flutter pub get
      - run: flutter build apk --flavor dev --target=lib/main_dev.dart

      - name: Create release notes
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')


          cat > release-notes.txt <<EOF
          Coffix Dev Release v$VERSION

      - name: Upload artifact to Firebase App Distribution
        uses: emertozd/Firebase-Distribution-Github-Action@v2
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID_DEV}}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_APP_DISTRIBUTION_CREDENTIAL_FILE_CONTENT }}
          groups: internal-testers
          file: build/app/outputs/flutter-apk/app-dev-release.apk
