name: Flutter CI
on:
  # pull_request:
  #   branches:
  #     - main
  push:
    branches:
      - main

jobs:
  flutter_test:
    name: Run flutter test and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Create .env file
        run: |
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" > .env.dev
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" > .env
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  build_android:
    name: Build Flutter (Android)
    needs: [flutter_test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Create .env file
        run: |
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" > .env.dev
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" > .env
      - run: flutter clean
      - run: flutter pub get
      - run: flutter build apk --flavor dev --target=lib/main_dev.dart
      - name: Upload artifact to Firebase App Distribution
        uses: emertozd/Firebase-Distribution-Github-Action@v2
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID_DEV}}
          serviceCredentialsFile: ${{ secrets.FIREBASE_APP_DISTRIBUTION_CREDENTIAL_FILE_CONTENT }}
          groups: internal-testers
          file: build/app/outputs/flutter-apk/app-dev-release.apk
