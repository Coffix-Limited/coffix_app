name: Flutter CI
on:
    pull_request:
        branches:
            - main

jobs:
  flutter_test:
      name: Run flutter test and analyze
      runs-on: ubuntu-latest
      steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-java@v4
            with: 
              java-version: "17"
              distribution: temurin
          - uses: subosito/flutter-action@v2
            with:
              channel: "stable"
          - run: flutter pub get
          - run: flutter analyze
          - run: flutter test
     